<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% if page.math %}<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">{% endif %}
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
  {% if page.mermaid or page.math %}<script type="module" src="{{ '/assets/js/article.js' | relative_url }}"></script>{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header shell">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Neoaksa Notes home"><span class="brand-mark" aria-hidden="true">n.</span><span>Neoaksa<span class="brand-light"> / Notes</span></span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/articles/' | relative_url }}" {% if page.url contains '/articles/' %}aria-current="page"{% endif %}>Articles</a>
      <a href="{{ '/categories/' | relative_url }}" {% if page.url == '/categories/' %}aria-current="page"{% endif %}>Categories</a>
      <a href="{{ '/tags/' | relative_url }}" {% if page.url == '/tags/' %}aria-current="page"{% endif %}>Tags</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer shell">
    <span>Neoaksa Notes <span class="footer-dot">·</span> Ideas, worked through.</span>
    <div><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a href="https://github.com/neoaksa/neoaksa.github.io">Source on GitHub</a></div>
  </footer>
</body>
</html>
