<article class="post-card">
  <div class="card-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%b %-d, %Y' }}</time>{% for category in include.post.categories %}<span>{{ category | escape }}</span>{% endfor %}</div>
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3>
  <p>{{ include.post.description | escape }}</p>
  <div class="card-bottom"><div class="tags">{% for tag in include.post.tags limit: 3 %}<a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag | escape }}</a>{% endfor %}</div><a class="read-link" href="{{ include.post.url | relative_url }}" aria-label="Read {{ include.post.title | escape }}">Read article <span aria-hidden="true">↗</span></a></div>
</article>
